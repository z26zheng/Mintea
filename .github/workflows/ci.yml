name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches, but never on main. A run there may be
  # mid-deploy, and cancelling between `supabase db push` and `functions deploy`
  # leaves the hosted schema ahead of the functions that read it — which is the
  # one state this pipeline is ordered to avoid.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned so a CLI release can never change what `db push` does to the hosted
  # project between two identical commits.
  SUPABASE_CLI_VERSION: 2.111.0

jobs:
  migrations:
    name: Migrations are append-only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against origin/main, which needs real history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Applied migrations are immutable. Catching a deletion here is the
      # difference between a red pull request and a hosted database whose
      # schema no longer matches any file in the repository.
      - name: Check append-only migration history
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/check-migrations.mjs origin/main

  build:
    name: Typecheck and build web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web
        # The Supabase values are public by design (RLS is the security
        # boundary). When the secrets aren't set the build still succeeds and
        # the app renders its setup screen — which is what we want CI to catch:
        # a bundle that fails to build, not a missing environment.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:web --workspace=@mintea/app

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/mintea/dist
          retention-days: 7

  mobile:
    name: Expo Doctor and native bundles
    runs-on: ubuntu-latest

    # The web build is not evidence that the mobile apps still bundle. A
    # landing-page stylesheet once broke both native exports for several
    # commits while typecheck, tests and the web build all stayed green,
    # because NativeWind compiles that CSS for native too and the web path
    # never touches it. These two exports are what would have caught it.
    #
    # Bundling only — no Xcode or Android SDK needed, so it runs on Linux in
    # about the time the web build takes.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Expo Doctor
        run: npx --yes expo-doctor
        working-directory: apps/mintea

      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir /tmp/export-ios
        working-directory: apps/mintea

      - name: Bundle for Android
        run: npx expo export --platform android --output-dir /tmp/export-android
        working-directory: apps/mintea

  deploy:
    name: Deploy to Vercel
    # The frontend calls database RPCs added by migrations, so publish it only
    # after the matching Supabase schema and Edge Functions are live.
    needs: [build, deploy-functions]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Skips rather than fails when Vercel isn't wired up yet. A permanently
      # red badge teaches people to ignore the badge; this stays green and
      # starts deploying on its own once the three secrets exist.
      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel deploy skipped::Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository secrets to enable deployment."
          fi

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest build --prod \
            --token="${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest deploy --prebuilt --prod \
            --token="${{ secrets.VERCEL_TOKEN }}"

  deploy-functions:
    name: Deploy Supabase backend
    # Never push a schema whose history has diverged from what already ran.
    needs: [build, migrations]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref izrgorgsoxkamebddlon --yes
          supabase db push --linked --yes

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref izrgorgsoxkamebddlon --use-api
