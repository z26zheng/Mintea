project_id = "mintea"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Auth below mirrors the hosted project (izrgorgsoxkamebddlon), which is the
# release behaviour. Verified 2026-08-01 against
# GET <project>/auth/v1/settings: email + Google providers enabled,
# disable_signup=false, mailer_autoconfirm=false (confirmations required).
#
# `site_url` stays local because this file configures the local stack; the
# hosted Site URL is the production web deployment. The redirect allow-list is
# the one setting that must be kept in sync by hand — it is not readable
# without the Management API, so changes here also have to be made in
# Dashboard → Authentication → URL Configuration.
[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081",
  "http://localhost:8081/**",
  # Native deep links. `mintea://**` covers every path the app builds with
  # Linking.createURL(), including `/` and `/reset-password`.
  "mintea://**",
  # Expo Go / dev client during development.
  "exp://**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Hosted requires confirmation, so local must too — otherwise the signup flow
# is tested against behaviour the release build never sees.
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

# Local Auth emails are captured by Inbucket (http://localhost:54324). Hosted
# projects use the same HTML copied into Authentication -> Email Templates.
[auth.email.template.confirmation]
subject = "Confirm your Mintea email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Mintea password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new Mintea email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You’re invited to Mintea"
content_path = "./supabase/templates/invite.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Mintea password was changed"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your Mintea email was changed"
content_path = "./supabase/templates/email_changed_notification.html"

[functions.plaid-link-token]
verify_jwt = true

[functions.plaid-exchange]
verify_jwt = true

[functions.plaid-sync]
verify_jwt = true

[functions.plaid-remove]
verify_jwt = true

[functions.property-value]
verify_jwt = true

# Plaid calls this one; it has no user session to present. The function
# authenticates the request itself by verifying Plaid's ES256 signature over
# the request body — see supabase/functions/plaid-webhook/index.ts.
[functions.plaid-webhook]
verify_jwt = false

[functions.address-search]
verify_jwt = true

# Irreversible, and acts on whichever household the JWT belongs to. The gateway
# rejects an unauthenticated call before the function runs; the function then
# re-resolves the caller itself rather than trusting anything in the body.
[functions.delete-account]
verify_jwt = true
